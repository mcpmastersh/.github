<rect x="40" y="228" width="260" height="190" rx="12" class="box"/>
<text x="60" y="256" class="lbl">YOUR AGENT</text>
<circle cx="272" cy="252" r="4" class="live"/>
<text x="60" y="288" class="s nm">Claude Code</text>
<text x="60" y="312" class="p s">Codex · Cursor · VS Code</text>
<text x="60" y="332" class="p s">Windsurf · OpenCode</text>
<line x1="60" y1="350" x2="280" y2="350" stroke="#ececf1"/>
<text x="60" y="374" class="c"><tspan class="ink">&gt;</tspan> list my open issues</text>
<text x="60" y="398" class="c"><tspan class="ink">$</tspan> mcpv run -- npm test</text>
<rect x="470" y="200" width="300" height="134" rx="12" class="hero"/>
<use href="#pm" x="490" y="220" width="44" height="44"/>
<text x="548" y="240" class="s nm">mcpmaster</text>
<text x="548" y="260" class="lbl">ONE MCP ENDPOINT</text>
<text x="490" y="292" class="c">1 <tspan class="ink">execute</tspan> tool · 1,642 behind it</text>
<text x="490" y="314" class="c">~515 tokens, not ~401,000</text>
<rect x="470" y="380" width="300" height="134" rx="12" class="hero"/>
<use href="#pv" x="490" y="400" width="44" height="44"/>
