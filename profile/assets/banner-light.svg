<text x="490" y="472" class="c">AES-256-GCM · offline · in memory</text>
<text x="490" y="494" class="c">output masked as <tspan class="red">[redacted]</tspan></text>
<text x="306" y="478" class="pk">agent sees <tspan class="red">[redacted]</tspan></text>
<text x="950" y="174" class="lbl" dy="10" opacity="0"> </text>
<rect x="950" y="184" width="250" height="32" rx="8" class="pill"/><text x="966" y="204.5" class="pn">github</text><text x="1184" y="204.5" class="pk" text-anchor="end">OpenAPI</text>
<rect x="950" y="229" width="250" height="32" rx="8" class="pill"/><text x="966" y="249.5" class="pn">stripe</text><text x="1184" y="249.5" class="pk" text-anchor="end">OpenAPI</text>
<rect x="950" y="274" width="250" height="32" rx="8" class="pill"/><text x="966" y="294.5" class="pn">linear</text><text x="1184" y="294.5" class="pk" text-anchor="end">GraphQL</text>
<rect x="950" y="319" width="250" height="32" rx="8" class="pill"/><text x="966" y="339.5" class="pn">files</text><text x="1184" y="339.5" class="pk" text-anchor="end">stdio MCP</text>
<text x="950" y="372" class="pk">+ any OpenAPI, GraphQL or MCP server</text>
<rect x="950" y="429" width="250" height="32" rx="8" class="pill"/><text x="966" y="449.5" class="pn">npm run dev</text><text x="1184" y="449.5" class="pk ok" text-anchor="end">keys injected</text>
